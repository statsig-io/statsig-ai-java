name: Lint Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  spotless-check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run Spotless check
      run: ./gradlew spotlessCheck

