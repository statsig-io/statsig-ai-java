plugins {
    id 'java'
    id 'com.diffplug.spotless' version '6.25.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.statsig:javacore:0.11.1:uber'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.alibaba.fastjson2:fastjson2:2.0.48'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

java {
    sourceCompatibility = 1.8
    targetCompatibility = 1.8
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0')
        importOrder()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}