plugins {
    id 'java'
    id 'com.diffplug.spotless' version '6.25.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.statsig:javacore:0.11.1:uber'
    implementation 'io.opentelemetry:opentelemetry-api:1.53.0'
    implementation 'io.opentelemetry:opentelemetry-sdk:1.53.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.53.0'
    implementation 'com.openai:openai-java:4.7.1'
    // Serializes eval payloads. openai-java already brings this version, so keep them in step.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    // Renders prompt templates. 1.15 is the newest release that runs on Java 8; 1.16 targets Java 9.
    implementation 'com.samskivert:jmustache:1.15'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.alibaba.fastjson2:fastjson2:2.0.48'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.mockito:mockito-core:3.12.4'
    testImplementation 'org.mockito:mockito-inline:3.12.4'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing:1.53.0'

    // Optional: only apps that call GeminiWrapper need the Google Gen AI SDK.
    compileOnly 'com.google.genai:google-genai:1.79.0'
    testImplementation 'com.google.genai:google-genai:1.79.0'
}

java {
    sourceCompatibility = 1.8
    targetCompatibility = 1.8
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0')
        importOrder()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
